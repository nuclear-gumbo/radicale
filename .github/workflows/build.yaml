name: build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - run: |
          set -eu
          version=$(sed -n 's/^ARG RADICALE_VERSION=//p' Dockerfile)
          image=ghcr.io/${{ github.repository_owner }}/radicale
          docker build -t "$image:$version" -t "$image:latest" .
          docker push --all-tags "$image"
          echo "### $image:$version" >> "$GITHUB_STEP_SUMMARY"
          docker inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$image:$version" >> "$GITHUB_STEP_SUMMARY"
